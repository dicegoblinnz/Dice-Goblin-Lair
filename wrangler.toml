# Dice Goblin Lair booking backend (Cloudflare Workers; the free plan is enough).
# Every push to main is built and deployed by Cloudflare Workers Builds.
name = "dice-goblin-lair"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "LAIR"
class_name = "Lair"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lair"]

# Settings and keys that change without a code change (Shopify client ID and secret, setup key, theme ID,
# email keys) live in this database's `config` table; the app writes its health check to `status`.
# A Worker variable or secret with the same name overrides the database value.
[[d1_databases]]
binding = "CONFIG"
database_name = "dice-goblin-lair-config"
database_id = "8d004701-239f-4805-886b-c1a09d6e3a64"

# Health check every 10 minutes (Shopify login, permissions, payment webhook, rooms and hours).
[triggers]
crons = ["*/10 * * * *"]

[vars]
SHOP = "ep0qiq-rp.myshopify.com"
API_VERSION = "2026-07"
CURRENCY = "NZD"
PUBLIC_URL = "https://dice-goblin-lair.dicegoblinnz.workers.dev"

[observability]
enabled = true
