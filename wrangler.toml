# Dice Goblin Lair booking backend (Cloudflare Workers, free plan is enough)
name = "dice-goblin-lair"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "LAIR"
class_name = "Lair"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lair"]

[vars]
SHOP = "ep0qiq-rp.myshopify.com"
API_VERSION = "2026-07"
CURRENCY = "NZD"
# While the new theme is unpublished, read the Lair settings from it instead of the live theme:
THEME_ID = "166589005927"

[observability]
enabled = true

# Secrets — set with `npx wrangler secret put NAME`, never commit them:
#   SHOPIFY_CLIENT_ID      from the app's settings in the Shopify Dev Dashboard
#   SHOPIFY_CLIENT_SECRET  same place
#   SETUP_KEY              any long random string, used once for /setup
#   RESEND_API_KEY         optional, for booking emails (resend.com)
#   FROM_EMAIL             optional, e.g. "Dice Goblin <bookings@dicegoblin.nz>"
#   STAFF_EMAIL            optional, gets "game to approve" and "paid but cancelled" alerts
#   REPLY_TO               optional, where customer replies go (e.g. the shop inbox)
